<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="description" content="HWHQ by HaydenWorks. Simple, calm, action first.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<title>HWHQ</title>
<style>
:root{
  --ink:#f4f7fd; --muted:#9db0c6; --cyan:#1fe2ff; --gold:#d7b36a;
  --card:rgba(16,24,39,.92); --line:rgba(120,160,190,.22);
  --btn:#16233a; --btn2:#1a2c47;
  /* Directional edge glow colors (Hayden, 2026-11-24): approve
     (right) green, archive (left) red, more info (down) purple,
     next lead (up) the standard HW electric neon blue, which is
     the --cyan accent. */
  --glow-up:#1fe2ff; --glow-approve:#3ddc84; --glow-archive:#ff5252; --glow-down:#b388ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:18px; line-height:1.45;
  background:
    radial-gradient(900px 600px at 18% 8%, rgba(31,226,255,.14), transparent 60%),
    radial-gradient(800px 700px at 85% 90%, rgba(215,179,106,.10), transparent 60%),
    linear-gradient(160deg,#0a1220 0%,#080d18 55%,#0a1626 100%);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:22px 16px; overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
.panel{
  position:relative; width:min(560px,100%); background:var(--card);
  border:1px solid var(--line); border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 4px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  padding:38px 30px 34px; backdrop-filter:blur(10px);
  animation:hover 7s ease-in-out infinite;
}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.panel.enter{animation:hover 7s ease-in-out infinite, rise .38s ease both}
@keyframes rise{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .panel,.panel.enter{animation:none}
}
h1.title{
  font-size:clamp(26px,6vw,34px); line-height:1.15; letter-spacing:-.5px;
  margin:0 0 26px; font-weight:760; text-align:center;
}
h1.title .tag{
  display:inline-block; vertical-align:middle; margin-left:10px; padding:4px 12px;
  font-size:13px; font-weight:700; letter-spacing:.6px; color:#0a1420;
  background:var(--gold); border-radius:999px;
}
.stack{display:flex; flex-direction:column; gap:14px}
.bigbtn{
  width:100%; min-height:64px; padding:16px 20px; text-align:center;
  background:linear-gradient(180deg,var(--btn2),var(--btn));
  border:1px solid var(--line); border-radius:20px; color:var(--ink);
  font-size:19px; font-weight:650; transition:transform .12s ease, border-color .12s ease;
}
.bigbtn:hover{transform:translateY(-2px); border-color:rgba(31,226,255,.55)}
.bigbtn:active{transform:translateY(0)}
.bigbtn.primary{background:linear-gradient(180deg,#25c8e8,#17a8c8); color:#04121a; border-color:transparent; font-weight:780}
.bigbtn .count{color:var(--cyan); font-weight:800}
.bigbtn.primary .count{color:#04121a}
.hqbtn{display:flex; flex-direction:column; align-items:center; gap:6px}
.hqbtn .hqname{font-size:20px; font-weight:750; line-height:1.2}
.hqbtn .hqmeta{display:flex; align-items:center; gap:10px}
.hqbtn .hqstatus{font-size:14px; color:var(--muted); font-weight:550}
.badge{
  display:inline-block; padding:3px 11px; border-radius:999px;
  background:var(--cyan); color:#04121a; font-size:13px; font-weight:800; letter-spacing:.3px;
}
.field{
  width:100%; min-height:60px; padding:15px 18px; margin:0 0 14px;
  background:#0c1626; border:1px solid var(--line); border-radius:18px; color:var(--ink); font-size:18px;
}
.field::placeholder{color:#7186a0}
textarea.field{min-height:110px; resize:vertical}
.quiet{
  display:block; margin:20px auto 0; background:none; border:0; color:var(--muted);
  font-size:15px; padding:10px 14px; text-decoration:underline; text-underline-offset:4px;
}
.demo{margin:22px 0 0; text-align:center; font-size:12px; letter-spacing:1.6px; color:#5f748e; text-transform:uppercase}
.backbtn,.helpbtn{
  position:absolute; width:48px; height:48px; border-radius:50%;
  background:rgba(22,35,58,.9); border:1px solid var(--line); color:var(--ink);
  font-size:21px; display:grid; place-items:center; z-index:3;
}
.backbtn{top:16px; left:16px}
.helpbtn{bottom:16px; right:16px; color:var(--gold); font-weight:800}
.with-corners{padding-top:52px}
.rows{display:flex; flex-direction:column; gap:12px}
.row{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:17px 20px; background:rgba(22,35,58,.55); border:1px solid var(--line); border-radius:18px;
  font-size:17px; width:100%; text-align:left; color:var(--ink);
}
button.row:hover{border-color:rgba(31,226,255,.55)}
.row b{font-weight:750; text-align:right}
.row .sub{display:block; font-size:14px; color:var(--muted); font-weight:500; margin-top:2px}
.leadbtn{justify-content:flex-start; flex-direction:column; align-items:stretch; gap:4px}
.leadbtn .lt{font-size:19px; font-weight:700}
.leadbtn .lm{font-size:15px; color:var(--muted)}
.empty{text-align:center; color:var(--muted); padding:26px 6px; font-size:17px}
.saved{text-align:center; font-size:19px; font-weight:700; padding:4px 0 16px}
.searchbox{margin-bottom:16px}
.overlay{position:fixed; inset:0; background:rgba(2,6,14,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50}
.popup{position:relative; width:min(420px,100%); background:rgba(18,28,46,.97); border:1px solid var(--line); border-radius:24px; padding:30px 24px 26px; box-shadow:0 30px 80px rgba(0,0,0,.55); animation:rise .25s ease both}
.popup h2{margin:0 0 20px; text-align:center; font-size:24px}
.xbtn{position:absolute; top:12px; right:12px; width:42px; height:42px; border-radius:50%; background:rgba(22,35,58,.9); border:1px solid var(--line); color:var(--ink); font-size:18px}
.toast{text-align:center; color:var(--cyan); font-size:15px; font-weight:650; margin-top:14px; min-height:20px}
.concierge-float{
  position:fixed; right:16px; bottom:16px; z-index:40;
  min-height:52px; padding:14px 22px; border-radius:999px;
  background:linear-gradient(180deg,#25c8e8,#17a8c8); color:#04121a;
  border:1px solid rgba(215,179,106,.55);
  font-size:17px; font-weight:780;
  box-shadow:0 14px 34px rgba(0,0,0,.45);
}
.badge.hot{background:var(--gold)}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.chip{
  padding:10px 16px; border-radius:999px; background:rgba(22,35,58,.55);
  border:1px solid var(--line); color:var(--ink); font-size:15px; font-weight:600;
}
.chip.on{border-color:var(--cyan); color:var(--cyan); font-weight:750}
.feedfilters{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-start; gap:8px; margin-bottom:12px}
.feedfilters .chip{min-height:36px; padding:6px 12px; font-size:14px}
select.field.feedselect{width:auto; min-height:36px; padding:6px 10px; margin:0; font-size:14px; border-radius:12px}
.feedpos{text-align:center; color:var(--muted); font-size:15px; font-weight:650; margin-bottom:12px}
.feedcard{
  background:rgba(22,35,58,.55); border:1px solid var(--line); border-radius:22px;
  padding:26px 22px; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
  animation:cardin .25s ease backwards; will-change:transform;
}
@keyframes cardin{from{opacity:0; transform:scale(.96)}to{opacity:1; transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .feedcard{animation:none}
}
.feedfx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.feedp{position:absolute; border-radius:50%}
.feedcard:active{cursor:grabbing}
.feedchips{display:flex; gap:8px; margin-bottom:14px}
.feedtitle{font-size:24px; font-weight:760; line-height:1.2}
.feedmeta{font-size:16px; color:var(--muted); margin-top:8px}
.feedamount{font-size:20px; font-weight:750; color:var(--gold); margin-top:10px}
.feedintent{font-size:16px; margin:16px 0 0; white-space:pre-wrap}
.badge.strength{background:rgba(215,179,106,.16); color:var(--gold); border:1px solid rgba(215,179,106,.55)}
.feedwrap{position:relative; width:min(480px,100%)}
.feedwrap.enter{animation:rise .38s ease both}
.feedstage{position:relative; margin:40px 0}
/* Card-pull demo text (Hayden, 2026-11-23): while the demo pulls
   the card toward a direction, this bare floating text names what
   that direction does, on the side the card is pulled toward.
   No container, no background, no border: readability is a soft
   text-shadow, exactly like the labels it replaces. The demo
   engine drives visibility through the .show class, fading the
   text in with the pull and out as the card returns. */
.feeddemo{
  position:absolute; z-index:2; pointer-events:none; white-space:nowrap;
  color:var(--ink); font-size:18px; font-weight:650; opacity:0;
  text-shadow:0 1px 10px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.5);
  transition:opacity .25s ease;
}
.feeddemo.show{opacity:1}
.feeddemo.up{left:50%; transform:translateX(-50%); bottom:calc(100% + 12px)}
.feeddemo.down{left:50%; transform:translateX(-50%); top:calc(100% + 12px)}
.feeddemo.left{right:calc(100% + 12px); top:50%; transform:translateY(-50%)}
.feeddemo.right{left:calc(100% + 12px); top:50%; transform:translateY(-50%)}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.feed-back-float{
  position:fixed; left:16px; bottom:16px; z-index:40;
  min-height:52px; padding:14px 22px; border-radius:999px;
  background:linear-gradient(180deg,var(--btn2),var(--btn)); color:var(--ink);
  border:1px solid var(--line);
  font-size:17px; font-weight:700;
  box-shadow:0 14px 34px rgba(0,0,0,.45);
}
.feedzone{position:fixed; z-index:1; cursor:pointer}
/* Directional edge glow (Hayden, 2026-11-24): one soft gradient
   strip per screen edge, bleeding inward about 140px, lit by
   feedGlow() while the card is dragged, pulsed by
   feedGlowPulse() on tap-zone and arrow-key actions, and lit by
   the demo on its pulled side. Intensity is the element opacity,
   driven inline. The rgba stops below are the --glow-* variables
   at the top of this sheet (up = --glow-up, right = --glow-approve,
   down = --glow-down, left = --glow-archive). pointer-events:none
   and z-index below the popups, so the glow can never block or
   cover an interaction. */
.feedglow{position:fixed; z-index:2; pointer-events:none; opacity:0; transition:opacity .2s ease}
.feedglow.up{top:0; left:0; right:0; height:140px; background:linear-gradient(180deg, rgba(31,226,255,.55), rgba(31,226,255,0))}
.feedglow.right{top:0; bottom:0; right:0; width:140px; background:linear-gradient(270deg, rgba(61,220,132,.55), rgba(61,220,132,0))}
.feedglow.down{bottom:0; left:0; right:0; height:140px; background:linear-gradient(0deg, rgba(179,136,255,.55), rgba(179,136,255,0))}
.feedglow.left{top:0; bottom:0; left:0; width:140px; background:linear-gradient(90deg, rgba(255,82,82,.55), rgba(255,82,82,0))}
/* Footer instruction hint (Hayden, 2026-11-24): one floating
   sentence at the bottom center of the feed screen, clear of the
   Back float (bottom-left) and the Concierge float
   (bottom-right). The container takes NO pointer events, so taps
   pass straight through it to the down tap zone beneath; only
   the small "turn off" subtext is interactive (pointer-events
   restored on it alone), and the hint stacks above the tap zones
   (z-index 1), so a tap on the subtext spotlights the toggle
   instead of triggering the down action. */
.feedhint{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:30; text-align:center; pointer-events:none}
.feedhint-main{font-size:16px; font-weight:650; color:var(--ink); white-space:nowrap; text-shadow:0 1px 10px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.5)}
.feedhint-off{pointer-events:auto; background:none; border:0; padding:6px 12px; color:var(--muted); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
/* The gold spotlight the "turn off" subtext puts on the Swipe
   mode toggle so the user can find it. */
#feedSwipeToggle.toggle-highlight{border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 0 20px 5px rgba(215,179,106,.8)}
.feedbtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.feedbtn{
  min-height:48px; padding:12px 10px; text-align:center;
  background:linear-gradient(180deg,var(--btn2),var(--btn));
  border:1px solid var(--line); border-radius:16px; color:var(--ink);
  font-size:17px; font-weight:650; cursor:pointer;
}
.feedbtn.primary{background:linear-gradient(180deg,#25c8e8,#17a8c8); color:#04121a; border-color:transparent; font-weight:780}
.hdlink{display:block; text-decoration:none; margin-bottom:14px}
@media (max-width:480px){
  body{padding:14px 10px}
  .panel{padding:30px 20px 28px; border-radius:24px}
  .with-corners{padding-top:48px}
  .bigbtn{font-size:18px; min-height:60px}
}
</style>
</head>
<body>
<main class="panel enter" id="panel" aria-live="polite"></main>
<div id="feedBackRoot"></div>
<div id="feedGlowRoot"></div>
<div id="feedHintRoot"></div>
<div id="conciergeRoot"></div>
<div id="popupRoot"></div>

<script>
(()=>{'use strict';
/* OpportunityHQ Next — PRODUCTION web build (PRODUCTION-PLAN P0-9).
   Same approved floating UI as the staging prototype, with the demo core
   removed:
   - No fixture tenants or leads anywhere. Every record comes from the API.
   - No persistence: the access token and all tenant data live in memory
     only. Nothing is written to web storage; a reload means a fresh login.
   - Session bootstrap via /api/me. No session = Login only, fail closed:
     an API error shows an error state, never fixture data.
   - Auth is the managed IdP (Supabase Auth REST). This build never sees
     or stores a password beyond the sign-in request itself.
   - Status changes are commands: POST /api/leads/:id/status with an
     Idempotency-Key. A 202 means "validated", not "saved": the lead is
     flagged as saving until a later refresh shows the verified state. */
let CONFIG=null;        // GET /api/config: public bootstrap config
let ACCESS_TOKEN=null;  // in memory only, never persisted
let DATA=null;          // { slug: { name, version, leads: [...] } }
const state={
  screen:'login',
  tenant:null,
  user:null,
  tenants:[],
  lastOppView:null,
  lastInsightsView:null,
  lastSearch:'',
  county:null, oppView:null, selected:null, savedMsg:false,
  feedStatus:'all', feedStrength:'all', feedType:'all', feedArea:'all', feedIndex:0,
  feedExpanded:false, feedBusy:false, feedErr:'', feedDemo:true,
  feedDemoActions:0, feedSwipeAt:0, feedSwipe:true,
  loginErr:'', createMsg:'', ticketId:null, busy:false, fatalErr:''
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadConfig(){
  if(CONFIG) return CONFIG;
  const r=await fetch('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/config');
  if(!r.ok) throw new Error('config_unavailable');
  CONFIG=await r.json();
  return CONFIG;
}
function tenantMeta(slug){
  const t=(CONFIG?.tenants||[]).find(x=>x.slug===slug);
  return t?{name:t.name, version:t.version}:{name:slug, version:'full'};
}
async function api(path, opts={}){
  const r=await fetch(path,{...opts, headers:{'Content-Type':'application/json', ...(ACCESS_TOKEN?{Authorization:'Bearer '+ACCESS_TOKEN}:{}), ...(opts.headers||{})}});
  let j={}; try{ j=await r.json(); }catch{}
  if(!r.ok) throw Object.assign(new Error(j.error||('HTTP '+r.status)), {status:r.status, code:j.error});
  return j;
}
async function idp(path, body){
  const cfg=await loadConfig();
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey) throw new Error('Sign-in is not available yet.');
  const r=await fetch(cfg.supabaseUrl+'/auth/v1'+path,{method:'POST', headers:{'Content-Type':'application/json', apikey:cfg.supabaseAnonKey}, body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch{}
  if(!r.ok) throw Object.assign(new Error(j.error_description||j.msg||j.error||'Sign-in failed.'), {status:r.status});
  return j;
}
/* Email links (reset, invite, signup confirmation) must land back on
   this exact page: without redirect_to, Supabase falls back to the
   Auth Site URL and the link dead-ends away from the app. */
const emailLinkTarget=()=>window.location.origin+window.location.pathname;
function toLead(row){
  const contacts=Array.isArray(row.contacts)?row.contacts:[];
  const posted=row.source_posted_at||row.source_updated_at||row.created_at;
  const age=posted?Math.max(0,Math.round((Date.now()-new Date(posted).getTime())/3600000)):0;
  const first=contacts[0];
  const route=first?(first.kind==='email'?'Verified email':first.kind==='phone'?'Phone':(first.label||'Source profile')):(row.source_platform||'Research needed');
  return {
    id: row.source_record_id||row.id,
    title: row.title,
    type: row.lead_type||'trigger',
    area: row.area||'Market not set',
    intent: row.summary||'',
    route, tier: row.contact_tier||null,
    status: row.operator_status||'new',
    amount: row.amount||null,
    age, contacts,
    updatedAt: row.source_updated_at||null,
    pendingSync: false
  };
}
async function loadTenantData(slug){
  const r=await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/leads?tenant='+encodeURIComponent(slug));
  const meta=tenantMeta(slug);
  DATA=DATA||{};
  DATA[slug]={name:meta.name, version:meta.version, leads:(r.leads||[]).map(toLead)};
}
async function bootstrap(){
  // Session bootstrap: /api/me is the only source of who this is and
  // which HQs they may see. No token in memory = no session = Login.
  // Tenant DATA loads only after an HQ is picked: with several HQs the
  // Choose screen comes first, so no client's leads are fetched before
  // its HQ is selected (and never for an HQ that is not entered).
  if(!ACCESS_TOKEN){ go('login'); return; }
  state.busy=true; render();
  try{
    const me=await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/me');
    state.user=me.email;
    state.tenants=me.tenants||[];
    DATA={};
    state.busy=false;
    if(!state.tenants.length){ state.loginErr='Your account is ready. HaydenWorks still needs to attach your HQ.'; go('login'); return; }
    if(state.tenants.length===1){ await selectTenant(state.tenants[0].tenant); return; }
    go('choose');
  }catch(e){
    state.busy=false;
    ACCESS_TOKEN=null; DATA=null; state.tenants=[]; state.tenant=null;
    state.fatalErr='We could not load your HQ. Check your connection and try again.';
    go('error');
  }
}
/* Pick an HQ: only now does that tenant's data load, then Home. */
async function selectTenant(slug){
  state.tenant=slug;
  go('loading');
  try{
    await loadTenantData(slug);
    go('home');
  }catch(e){
    state.tenant=null;
    state.fatalErr='We could not load your HQ. Check your connection and try again.';
    go('error');
  }
}
/* Switch HQ: fresh /api/me first, so names, statuses, and new-lead
   counts on the Choose screen are current, then show the picker. A
   failed refresh keeps the last known list rather than stranding the
   user on an error screen. */
async function showChoose(){
  try{
    const me=await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/me');
    state.tenants=me.tenants||[];
  }catch(e){ /* keep the existing list */ }
  go('choose');
}
const info=()=>DATA[state.tenant];
const leads=()=> (DATA[state.tenant].leads||[]);
const fresh=l=>l.status==='new'&&l.age<12;
const strength=l=>({A:4,B:3,C:2,D:1}[l.tier]||0)*10+(l.type==='direct'?5:0)-Math.min(l.age/24,5);
const typeLabel=l=>l.type==='direct'?'Direct lead':'Project trigger';
const statusLabel=s=>({new:'New',reviewing:'Reviewing',contact_planned:'Contact planned',interested:'Interested',outreach_attempted:'Outreach attempted',outreach_sent:'Outreach sent',engaged:'Engaged',qualified:'Qualified',application_started:'Application started',submitted_to_provider:'Submitted to provider',funded:'Funded',funded_elsewhere:'Funded elsewhere',nurture:'Follow up',passed:'Passed',disqualified:'Disqualified',closed_lost:'Closed lost',closed:'Closed',expired:'Expired'})[s]||s;
const ageLabel=l=>l.age<1?'Just now':l.age<24?l.age+'h ago':Math.round(l.age/24)+'d ago';
const postedLabel=l=>l.age<24?ageLabel(l):new Date(Date.now()-l.age*3600000).toLocaleDateString(undefined,{month:'short',day:'numeric'});
/* Amounts are shown only when a lead actually carries one (the API
   supplies none today, so this renders nothing until it does). */
const amountText=a=>(a===null||a===undefined||a==='')?'':(typeof a==='number'&&Number.isFinite(a)?'$'+a.toLocaleString('en-US'):String(a));
/* Strength tag for the feed card (Hayden, 2026-11-23): a plain word
   from the lead's tier (A Strong, B Solid, C Fair, D Light). The
   tier is the board's own value, carried end to end: the Notion
   board's "Contact Tier" select, read by the per-tenant mapper and
   normalized to A-D (null when the board record has none), stored
   by board sync as leads.contact_tier, and returned by GET
   /api/leads, so toLead receives it as row.contact_tier. toLead
   preserves null rather than defaulting: only a lead whose board
   record genuinely has no tier falls back to the strength() score
   bands: >=30 Strong, 20-29 Solid, 10-19 Fair, below 10 Light. If
   neither a tier nor a finite score exists, there is no tag. */
const STRENGTH_WORDS=Object.freeze({A:'Strong',B:'Solid',C:'Fair',D:'Light'});
function strengthWord(l){
  const tiered=STRENGTH_WORDS[String(l?.tier||'').toUpperCase()];
  if(tiered) return tiered;
  const s=strength(l||{});
  if(!Number.isFinite(s)) return '';
  return s>=30?'Strong':s>=20?'Solid':s>=10?'Fair':'Light';
}

const HQ_TYPE_LABELS={opportunity:'OpportunityHQ',territory:'TerritoryHQ',partner:'PartnerHQ'};
/* HQ entitlement status for the picker: 'active' reads "Active"; any
   other value is shown title-cased as stored. Absent status (API not

function statusText(s){

/* ---- Opportunities swipe feed (Hayden, 2026-11-23) ----
   One floating card at a time over the undecided queue (status
   'new'), hot leads first, then strongest. Four directions, one set
   of action functions shared by swipe, tap zones, and arrow keys:
   up = next, down = expand, right = approve, left = archive.
   A Swipe mode toggle in the filter row (state.feedSwipe, default
   on) turns ALL directional input off: no drag, no tap zones, no
   arrow keys, no demo. The card then carries the four actions
   as buttons (Next, Approve, Archive, More info) through the same
   feedAction dispatcher.
   Directional edge glow and a footer instruction hint (Hayden,
   2026-11-24): the screen edge toward the active direction glows
   in that direction's color, with intensity following the card's
   rendered distance toward the edge (see the glow engine below),
   and a floating footer sentence teaches the gesture while its
   "turn off" subtext spotlights the Swipe mode toggle. */
/* Card-pull demo (Hayden, 2026-11-23, replacing the emoji arrow
   labels shipped earlier the same day): instead of static labels,
   the card itself is pulled toward one direction at a time, in a
   paced loop (up, right, down, left), and a bare floating text
   naming that direction's action pops up on the side the card is
   pulled toward: up "Next lead", right "Approve", down "More
   info", left "Archive". Only one description is visible at a
   time. The pull is deliberately unmistakable (FEED_DEMO_PULL_PX,
   strengthened the same night at Hayden's direction so the card
   visibly LEANS into the direction its description names): it
   eases out with a slight spring overshoot as it settles at the
   pulled position, the description fades in as the pull begins
   and stays through the hold, and the card springs back to
   center on the return. The demo runs under the same
   visibility rules the labels had: it starts when the feed opens
   (after the card's entrance settles), stops for the session
   window once FEED_DEMO_HIDE_AFTER directional actions (swipe,
   tap zone, or arrow key, any mix) have been registered, and
   restarts after FEED_DEMO_IDLE_MS with no activity at all: no
   directional action, no expand or collapse, no filter change.
   Every one of those re-renders the feed, and vFeed re-arms the
   idle timer on each render, so the timer measures true
   inactivity. The demo never runs while the card is expanded, in
   the caught-up state, in swipe mode off, or under reduced
   motion. Conflict safety: the demo drives the card's transform
   and so does drag, so a pointerdown on the card stops the demo
   on the spot (its transform and timers clear before the drag
   wiring takes over) and the demo engine never applies a
   transform while a drag is active; a drag-paused demo may
   resume under the idle rules above. */
const FEED_DEMO_HIDE_AFTER=3;
const FEED_DEMO_IDLE_MS=6000;
const FEED_DEMO_START_MS=400;
const FEED_DEMO_PULL_PX=36;
const FEED_DEMO_PULL_MS=450;
const FEED_DEMO_HOLD_MS=700;
const FEED_DEMO_RETURN_MS=350;
const FEED_DEMO_PAUSE_MS=500;
const FEED_DEMO_STEPS=Object.freeze([
  {dir:'up', cls:'up', text:'Next lead', x:0, y:-FEED_DEMO_PULL_PX, rot:0},
  {dir:'approve', cls:'right', text:'Approve', x:FEED_DEMO_PULL_PX, y:0, rot:3},
  {dir:'down', cls:'down', text:'More info', x:0, y:FEED_DEMO_PULL_PX, rot:0},
  {dir:'archive', cls:'left', text:'Archive', x:-FEED_DEMO_PULL_PX, y:0, rot:-3},
]);
let feedIdleTimer=null;
let feedDemoTimer=null;
let feedDemoStep=0;
let feedDemoActive=false;
let feedDemoApplied=false;
let feedDragActive=false;
function feedQueue(){
  let ls=leads().filter(l=>l.status==='new');
  if(state.feedStatus==='hot') ls=ls.filter(fresh);
  if(state.feedStatus==='new') ls=ls.filter(l=>!fresh(l));
  if(state.feedStrength!=='all') ls=ls.filter(l=>strengthWord(l)===state.feedStrength);
  if(state.feedType!=='all') ls=ls.filter(l=>l.type===state.feedType);
  if(state.feedArea!=='all') ls=ls.filter(l=>l.area===state.feedArea);
  return ls.sort((a,b)=>((fresh(b)?1:0)-(fresh(a)?1:0))||(strength(b)-strength(a)));
}
const feedCurrent=()=>feedQueue()[state.feedIndex]||null;
/* One feed page, two menu presets (Hayden, 2026-11-23): All
   Opportunities opens it with the Status filter at All, Hot
   Opportunities with Status at Hot. Filter changes afterwards
   behave normally; re-entering re-applies the preset. */
function openFeed(preset){
  state.feedStatus=preset==='hot'?'hot':'all'; state.feedIndex=0; state.feedExpanded=false;
  state.feedErr=''; state.feedDemo=true; state.feedDemoActions=0;
  go('feed');
}
function clearFeedIdle(){ if(feedIdleTimer){ clearTimeout(feedIdleTimer); feedIdleTimer=null; } }
/* Arm the 6-second idle timer. Called at the end of every feed
   render, so any activity that re-renders pushes the restart out
   by a full idle window. On firing, a demo hidden by the action
   threshold comes back (counter reset, so another 3 actions hide
   it), and a demo merely paused by a drag resumes in place. */
function armFeedIdle(){
  clearFeedIdle();
  if(state.screen!=='feed') return;
  if(!state.feedSwipe) return;
  feedIdleTimer=setTimeout(()=>{ feedIdleTimer=null;
    if(state.screen==='feed'&&!state.feedDemo&&!state.feedExpanded&&feedCurrent()){
      state.feedDemo=true; state.feedDemoActions=0; render();
    } else if(state.screen==='feed'&&state.feedDemo&&!feedDemoActive&&!state.feedExpanded&&feedCurrent()){
      startFeedDemo();
    } },FEED_DEMO_IDLE_MS);
}
/* The demo may run only on a live, unexpanded feed card in swipe
   mode, before the hide threshold, and never under reduced
   motion: no card movement, no popups; actions still register. */
function feedDemoWanted(){
  return state.screen==='feed'&&state.feedSwipe&&state.feedDemo&&!state.feedExpanded&&!!feedCurrent()&&!REDUCED_MOTION();
}
/* Stop the demo completely: timers cleared, and if the demo had
   pulled the card, its transform is cleared too (only then, so a
   drag fly-off already in flight is never snapped back). The
   floating description fades out. */
function stopFeedDemo(){
  if(feedDemoTimer){ clearTimeout(feedDemoTimer); feedDemoTimer=null; }
  feedDemoActive=false;
  if(feedDemoApplied){
    feedDemoApplied=false;
    const card=$('feedCard');
    if(card){ card.style.transition=''; card.style.transform=''; card.style.opacity=''; }
  }
  const tip=$('feedDemoTip');
  if(tip) tip.classList.remove('show');
  feedGlowClear();
}
function startFeedDemo(){
  stopFeedDemo();
  if(!feedDemoWanted()||feedDragActive) return;
  feedDemoActive=true; feedDemoStep=0;
  feedDemoTimer=setTimeout(feedDemoPull,FEED_DEMO_START_MS);
}
/* One demo beat: pull the card slightly toward the step's
   direction while its description pops up on that side, hold,
   then ease back to center and fade the text (feedDemoReturn). */
function feedDemoPull(){
  feedDemoTimer=null;
  if(!feedDemoActive||feedDragActive||!feedDemoWanted()){ feedDemoActive=false; return; }
  const card=$('feedCard'); const tip=$('feedDemoTip');
  if(!card||!tip){ stopFeedDemo(); return; }
  const s=FEED_DEMO_STEPS[feedDemoStep%FEED_DEMO_STEPS.length];
  tip.textContent=s.text;
  tip.className='feeddemo '+s.cls+' show';
  card.style.transition=`transform ${FEED_DEMO_PULL_MS}ms cubic-bezier(.22,1.36,.36,1)`;
  card.style.transform=`translate(${s.x}px,${s.y}px) rotate(${s.rot}deg)`;
  /* The pulled edge glows at the intensity the pull distance
     earns through the same mapping the drag uses (36px of pull
     is a moderate glow), synced with the pull; feedDemoReturn
     clears it as the card comes back. */
  feedGlow(s.dir, glowIntensity(Math.max(Math.abs(s.x),Math.abs(s.y))));
  feedDemoApplied=true;
  feedDemoTimer=setTimeout(feedDemoReturn,FEED_DEMO_PULL_MS+FEED_DEMO_HOLD_MS);
}
function feedDemoReturn(){
  feedDemoTimer=null;
  if(!feedDemoActive) return;
  const card=$('feedCard'); const tip=$('feedDemoTip');
  if(tip) tip.classList.remove('show');
  feedGlowClear();
  if(card){ card.style.transition=`transform ${FEED_DEMO_RETURN_MS}ms cubic-bezier(.34,1.3,.64,1)`; card.style.transform=''; }
  feedDemoApplied=false;
  feedDemoStep++;
  feedDemoTimer=setTimeout(feedDemoPull,FEED_DEMO_RETURN_MS+FEED_DEMO_PAUSE_MS);
}
/* One directional action (swipe, tap zone, or arrow key) through
   feedAction: count it, and stop the demo at the threshold. */
function noteFeedDirectional(){
  state.feedDemoActions++;
  if(state.feedDemoActions>=FEED_DEMO_HIDE_AFTER){ state.feedDemo=false; stopFeedDemo(); }
}
function stopFeedChrome(){
  clearFeedZones();
  clearFeedIdle();
  stopFeedDemo();
  feedGlowClear();
}
function feedUp(){
  if(state.feedBusy) return;
  if(state.feedExpanded){ state.feedExpanded=false; render(); return; }
  if(state.feedIndex<feedQueue().length){ state.feedIndex++; render(); }
}
function feedDown(){
  if(state.feedBusy||state.feedExpanded) return;
  if(!feedCurrent()) return;
  state.feedExpanded=true; render();
}
function feedApprove(){ feedDecide('reviewing'); }
function feedArchive(){ feedDecide('passed'); }
function feedAction(name){
  if($('popupRoot').innerHTML) return;
  noteFeedDirectional();
  feedParticles(name);
  feedGlowPulse(name);
  ({up:feedUp, down:feedDown, approve:feedApprove, archive:feedArchive})[name]?.();
}
/* Approve and archive are ordinary status commands through the exact
   path the detail view uses: same endpoint, same Idempotency-Key,
   same 202-means-saving handling (status updated locally, flagged
   pendingSync). 'reviewing' and 'passed' are both legal from 'new'
   and carry no confirmation gate, so a swipe can never trigger the
   engaged / outreach_sent attestations, which stay in the detail
   flow. On failure the card stays put and the error shows plainly. */
async function feedDecide(target){
  if(state.feedBusy) return;
  const l=feedCurrent(); if(!l) return;
  state.feedBusy=true; state.feedErr='';
  try{
    await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/leads/'+encodeURIComponent(l.id)+'/status',{
      method:'POST',
      headers:{'Idempotency-Key': crypto.randomUUID()},
      body:JSON.stringify({tenant:state.tenant, status:target, confirmConversation:false, confirmSent:false})
    });
    l.status=target; l.pendingSync=true;
    state.feedExpanded=false;
  }catch(e){
    state.feedErr=STATUS_ERRORS[e.code]||'We could not save that change. Please try again.';
  }

/* Directional edge glow engine (Hayden, 2026-11-24): one helper

   way. feedGlow(dir, intensity) lights one edge (and only one)
   at the given opacity; feedGlowPulse(dir) flashes an edge for a
   tap-zone tap or an arrow key (rise to FEED_GLOW_PULSE_PEAK,
   gone by FEED_GLOW_PULSE_MS); feedGlowClear() puts every edge
   out and cancels any pulse in flight. The intensity mapping is
   pure: 0 at rest, ramping with the RENDERED (magnet-adjusted)
   displacement magnitude, full at FEED_MAGNET_FULL (the
   magnet-full distance, 64px) and holding beyond. The glow is

   button mode has no directional decisions to confirm. */
const FEED_GLOW_PULSE_MS=450;

const FEED_GLOW_SIDES=Object.freeze({up:'Up',approve:'Right',down:'Down',archive:'Left'});
function glowIntensity(magnitude){
  return Math.min(1,(Math.abs(magnitude)||0)/FEED_MAGNET_FULL);
}
function feedGlowEl(dir){ const suffix=FEED_GLOW_SIDES[dir]; return suffix?$('feedGlow'+suffix):null; }
function feedGlow(dir,intensity){
  for(const d of Object.keys(FEED_GLOW_SIDES)){
    const el=feedGlowEl(d); if(!el) continue;

function feedGlowClear(){

function feedGlowPulse(dir){

/* Magnetic drag physics (Hayden, 2026-11-23): like the Hello
   element on the Client Hub screen, the card does not track the
   pointer rigidly. A pure magnet mapping first reshapes the raw
   pointer displacement, per axis: inside FEED_MAGNET_INNER px of
   the base position the card is pulled back toward the middle
   (rendered at FEED_MAGNET_RESIST of raw, a light resistance);
   from there to the FEED_DRAG_THRESHOLD action point it tracks
   neutrally; past the threshold the pull toward the closest
   direction takes over and grows progressively stronger (the
   marginal assist ramps up to FEED_MAGNET_ASSIST by
   FEED_MAGNET_FULL and holds there), so the rendered card runs
   ahead of the pointer and visibly leans into the action it is
   about to take. The mapping is continuous and monotonic, and
   zero maps to zero. The rendered position then CHASES the
   mapped target with spring smoothing: each animation frame
   closes FEED_DRAG_CHASE of the remaining distance, so the card
   trails the hand with a soft springy lag; rotation follows the
   rendered horizontal displacement. */
const FEED_DRAG_THRESHOLD=40;
const FEED_MAGNET_RESIST=0.8;
const FEED_MAGNET_ASSIST=1.25;
const FEED_MAGNET_INNER=16;
const FEED_MAGNET_FULL=64;
const FEED_DRAG_CHASE=0.35;
function magnetAxis(v){
  if(!v) return 0;
  const sign=v<0?-1:1, a=Math.abs(v);
  const innerEdge=FEED_MAGNET_INNER*FEED_MAGNET_RESIST;
  if(a<=FEED_MAGNET_INNER) return sign*a*FEED_MAGNET_RESIST;
  if(a<=FEED_DRAG_THRESHOLD) return sign*(innerEdge+(a-FEED_MAGNET_INNER));
  const thresholdEdge=innerEdge+(FEED_DRAG_THRESHOLD-FEED_MAGNET_INNER);
  const span=FEED_MAGNET_FULL-FEED_DRAG_THRESHOLD;
  if(a<=FEED_MAGNET_FULL){
    const t=a-FEED_DRAG_THRESHOLD;
    return sign*(thresholdEdge+t+(FEED_MAGNET_ASSIST-1)*t*t/(2*span));
  }
  const fullEdge=thresholdEdge+span+(FEED_MAGNET_ASSIST-1)*span/2;
  return sign*(fullEdge+(a-FEED_MAGNET_FULL)*FEED_MAGNET_ASSIST);

function magnetOffset(dx,dy){ return {x:magnetAxis(dx), y:magnetAxis(dy)}; }
/* Drag on the card itself (Pointer Events unify mouse and touch):

   slight rotation on the rendered horizontal drag. Release is
   judged on the RAW displacement and its outcomes are unchanged:
   under the FEED_DRAG_THRESHOLD threshold the card springs back
   with an overshoot ease; at or past it the card flies off in
   that direction, starting from its rendered (magnet-adjusted)
   position, and only then registers the action; expand (down) is
   the exception: it settles back and expands in place. The chase
   loop is cancelled on release before the spring-back or fly-off
   transition takes over, so the two never fight. With reduced
   motion there is no chase and no magnet: the card follows the
   raw pointer and release registers instantly, with no fly-off.

   also fire a card button. Gesture isolation: a press that starts

function wireFeedCard(){
  const card=$('feedCard'); if(!card) return;
  let sx=0, sy=0, dx=0, dy=0, pid=null;
  /* Rendered displacement (rx, ry): the magnet-mapped target,

  let rx=0, ry=0, chaseRaf=null;
  const paintDrag=()=>{
    const rot=Math.max(-6,Math.min(6,rx/18));
    card.style.transform=`translate(${rx}px,${ry}px) rotate(${rot}deg)`;

       chase loop, so it moves as smoothly as the card: the
       dominant axis of the RENDERED displacement picks the side
       (the same direction logic the release uses), and the
       rendered magnitude along it sets the intensity through
       glowIntensity(). Reduced motion paints through here too,
       so its drags glow as well. */

    document.removeEventListener('pointerup',onUp);

    const dir=ax>ay?(dx>0?'approve':'archive'):(dy<0?'up':'down');
    if(dir==='down'||REDUCED_MOTION()){ springBack(); feedAction(dir); return; }
    const offX=dir==='approve'?window.innerWidth+80:dir==='archive'?-(window.innerWidth+80):rx;
    const offY=dir==='up'?-(window.innerHeight+80):ry;

    card.style.transform=`translate(${offX}px,${offY}px) rotate(${dir==='approve'?10:dir==='archive'?-10:0}deg)`;
    card.style.opacity='0';
    setTimeout(()=>{ if(state.screen==='feed') feedAction(dir); },290);
  };
  card.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,select,input,textarea,a,[data-nogesture]')) return;
    if(state.feedBusy||pid!==null) return;
    stopFeedDemo();
    feedGlowClear();
    feedDragActive=true;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; dy=0; rx=0; ry=0;

    document.addEventListener('pointerup',onUp);
  });
}
/* Tap fallback for devices that do not swipe: four invisible zones

   screen: the filters row (marked data-nogesture) is cut out of
   the up and left zones from its own rectangle; the approve
   (right) zone's bottom stops a reserved strip above the floating
   Concierge button in the bottom-right corner, and the archive
   (left) and down zones likewise stop above, or start right of,
   the backReserve strip for the floating Back button in the
   bottom-left corner. Both floats stack at z-index 40, above the
   zones, so they win any remaining edge. */
function clearFeedZones(){ $('feedZones')?.remove(); }
function buildFeedZones(){
  clearFeedZones();
  const cardEl=$('feedCard'); if(!cardEl) return;
  const r=cardEl.getBoundingClientRect();
  const vw=window.innerWidth, vh=window.innerHeight, gap=12;
  const conciergeReserve=84;
  const backReserve=84;
  const backReserveW=150;
  const fr=document.querySelector('[data-nogesture]')?.getBoundingClientRect()||null;
  const zones=document.createElement('div'); zones.id='feedZones';
  const labels={up:'Next opportunity',down:'More info',approve:'Approve',archive:'Archive'};
  const mk=(act,x,y,w,h)=>{
    if(w<8||h<8) return;
    const d=document.createElement('div');
    d.className='feedzone'; d.dataset.feedzone=act;
    d.setAttribute('role','button'); d.setAttribute('aria-label',labels[act]);
    Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});

  mk('down', r.left, r.bottom+gap, r.width, vh-backReserve-(r.bottom+gap));

  const cur=state.lastInsightsView||'relevant';
  panel(`<h1 class="title">Insights</h1>

}

}

  panel(`<h1 class="title">Help</h1>

  <form id="helpForm">

function vSearch(){
  const q=(state.lastSearch||'').toLowerCase();
  let results='';
  if(q){
    const hits=leads().filter(l=>(l.title+' '+l.area+' '+typeLabel(l)).toLowerCase().includes(q));
    results=hits.length? hits.map(l=>`<button class="row leadbtn" data-lead="${esc(l.id)}"><span class="lt">${esc(l.title)}</span><span class="lm">${esc(l.area)}</span></button>`).join('') : '<div class="empty">No matches.</div>';
  }
  panel(`<h1 class="title">Search</h1>
  <input class="field searchbox" id="searchInput" placeholder="Type to search" value="${esc(state.lastSearch||'')}" aria-label="Search">
  <div class="rows">${results}</div>`, corners('home'), true);
}
function render(){
  if(state.screen!=='feed') stopFeedChrome();
  ({login:vLogin,create:vCreate,forgot:vForgot,setpassword:vSetPassword,choose:vChoose,home:vHome,opps:vOpps,feed:vFeed,list:vList,detail:vDetail,insights:vInsights,status:vStatus,help:vHelp,search:vSearch,loading:vLoading,error:vError}[state.screen]||vLogin)();
}

async function attemptLogin(){
  const u=($('u')?.value||'').trim(), p=$('p')?.value||'';
  if(!u){$('u')?.focus(); return}
  if(!p){$('p')?.focus(); return}
  state.loginErr=''; state.createMsg='';
  try{
    const r=await idp('/token?grant_type=password',{email:u, password:p});
    if(!r.access_token) throw new Error('Sign-in failed.');
    ACCESS_TOKEN=r.access_token;
    await bootstrap();
  }catch(e){
    ACCESS_TOKEN=null;
    state.loginErr=e.message||'Sign-in failed.';
    if(state.screen!=='error') render();
  }
}
async function attemptCreate(){
  const u=($('cu')?.value||'').trim(), p=$('cp')?.value||'';
  if(!u||!u.includes('@')){$('cu')?.focus(); return}
  if(!p){$('cp')?.focus(); return}
  state.loginErr='';
  try{
    const target=emailLinkTarget();
    await idp('/signup?redirect_to='+encodeURIComponent(target),{email:u, password:p, redirect_to:target});
    state.createMsg='Check your email to verify your account, then log in.';
    go('login');
  }catch(e){
    // A duplicate signup means the account already exists: point at
    // the route that can actually finish, setting a password through
    // Forgot password.
    const msg=e.message||'';
    state.loginErr=(e.status===422||/already[^.]*?(registered|exists)/i.test(msg))
      ? 'That email already has an account. Use Forgot password to set your password.'
      : (msg||'Could not create the account.');
    render();
  }
}
async function attemptForgot(){
  const u=($('fu')?.value||'').trim();
  if(!u||!u.includes('@')){$('fu')?.focus(); return}
  state.loginErr='';
  try{
    const cfg=await loadConfig();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey) throw new Error('Password reset is not available yet.');
    const target=emailLinkTarget();
    await idp('/recover?redirect_to='+encodeURIComponent(target),{email:u, redirect_to:target});
    state.savedMsg=true; render();
  }catch(e){
    state.loginErr=e.message||'Could not send the reset link.';
    render();
  }
}
/* Set the password for an adopted email-link session (recovery or
   invite). The access token IS the session: PUT /auth/v1/user with it
   as the bearer updates the account password, and bootstrap() then
   runs on the already-valid session. */
async function attemptSetPassword(){
  const p=$('np')?.value||'';
  if(!p){$('np')?.focus(); return}
  state.loginErr='';
  try{
    const cfg=await loadConfig();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!ACCESS_TOKEN) throw new Error('Password setup is not available yet.');
    const r=await fetch(cfg.supabaseUrl+'/auth/v1/user',{method:'PUT', headers:{'Content-Type':'application/json', apikey:cfg.supabaseAnonKey, Authorization:'Bearer '+ACCESS_TOKEN}, body:JSON.stringify({password:p})});
    let j={}; try{ j=await r.json(); }catch{}
    if(!r.ok) throw new Error(j.error_description||j.msg||j.error||'Could not set the password.');
    await bootstrap();
  }catch(e){
    state.loginErr=e.message||'Could not set the password.';
    render();
  }
}
/* The ONE ticket submit path. The Help view and the Concierge popup
   both call this, so endpoint, payload, tenant scoping, and ticket-id
   handling can never diverge between them. Throws on API failure; the
   callers own their surface's error display. */
async function submitTicket(description){
  const r=await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/tickets',{method:'POST', body:JSON.stringify({tenant:state.tenant, category:'other', description})});
  state.ticketId=r.ticket?.id||null;
  return r;
}
async function sendHelp(){
  const text=($('helpText')?.value||'').trim();
  if(!text){$('helpText')?.focus(); return}
  state.loginErr='';
  try{
    await submitTicket(text);
    state.savedMsg=true; render();
  }catch(e){
    state.loginErr='We could not save that. Please try again.';
    render();
  }
}
/* Concierge popup: the same ticket intake as the Help view, presented
   as a chat box. There is deliberately no live-chat backend: the
   operating concierge is draft-first and human-backed, so a sent
   message is a ticket the team picks up, exactly like Help. */
async function sendConcierge(){
  const field=$('conciergeText');
  const text=(field?.value||'').trim();
  if(!text){field?.focus(); return}
  const msg=$('conciergeMsg');
  try{
    await submitTicket(text);
    if(field) field.value='';
    if(msg) msg.innerHTML=`<div class="saved">Saved. We will take it from here.${state.ticketId?`<span class="sub" style="display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:4px">Ticket ${esc(state.ticketId)}</span>`:''}</div>`;
    loadPastRequests();
  }catch(e){
    if(msg) msg.innerHTML=`<p class="demo" style="color:#ff9d9d">We could not save that. Please try again.</p>`;
  }
}
async function openConcierge(){
  // The header button needs the same /api/config value the Help view
  // uses; load it if this session has not yet. A null booking URL
  // hides the button entirely: fail closed, never a dead link.
  try{ await loadConfig(); }catch{}
  const booking=CONFIG?.helpDeskBookingUrl;
  const visit=booking?`<a class="bigbtn hdlink" href="${esc(booking)}" target="_blank" rel="noopener">Visit Help Desk</a>`:'';
  $('popupRoot').innerHTML=`<div class="overlay" id="overlay"><div class="popup" role="dialog" aria-label="Concierge">
    <button class="xbtn" id="popupX" aria-label="Close">✕</button>
    <h2>💬 Concierge</h2>
    ${visit}
    <form id="conciergeForm">
      <textarea class="field" id="conciergeText" placeholder="What do you need?" aria-label="What do you need?"></textarea>
      <button class="bigbtn primary" type="button" id="conciergeSend">Send</button>
    </form>
    <div id="conciergeMsg"></div>
    <div id="conciergePast"></div></div></div>`;
  $('conciergeText')?.focus();
  if(state.tenant) loadPastRequests();
}
/* Past requests: the client's OWN tickets for the current HQ, newest
   first, via the existing GET /api/tickets read path. The API scopes
   it to the signed-in submitter and checks HQ membership (403 for any
   other HQ), so this list can never show another client's requests.
   Without a chosen HQ there is nothing to scope to, so the section
   stays empty. A load failure degrades to a quiet note, never an
   error that blocks the popup. */
const ticketStatusLabel=s=>({pending:'Pending',assigned:'Assigned',in_progress:'In progress',resolved:'Resolved'})[s]||s;
async function loadPastRequests(){
  const box=$('conciergePast'); if(!box||!state.tenant) return;
  box.innerHTML=`<div class="empty" style="padding:14px 6px">Loading past requests.</div>`;
  try{
    const r=await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/tickets?tenant='+encodeURIComponent(state.tenant));
    if(!$('conciergePast')) return;
    const ts=r.tickets||[];
    const items=ts.map(t=>{
      const d=String(t.description||'');
      const summary=d.length>120?d.slice(0,120)+'…':d;
      const when=t.createdAt?new Date(t.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
      return `<div class="row"><span>${esc(summary)}${when?`<span class="sub">${esc(when)}</span>`:''}</span><b>${esc(ticketStatusLabel(t.status))}</b></div>`;
    }).join('');
    box.innerHTML=`<h2 style="font-size:20px;margin-top:22px">Past requests</h2>`+(ts.length?`<div class="rows">${items}</div>`:`<div class="empty">No past requests yet.</div>`);
  }catch(e){
    if($('conciergePast')) box.innerHTML=`<div class="empty" style="padding:14px 6px">Past requests are not available right now.</div>`;
  }
}
async function attemptLogout(){
  try{ if(ACCESS_TOKEN) await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/auth/logout',{method:'POST'}); }catch{}
  ACCESS_TOKEN=null; DATA=null;
  state.user=null; state.tenant=null; state.tenants=[]; state.selected=null;
  state.lastSearch=''; state.ticketId=null; state.loginErr=''; state.createMsg='';
  closeContact();
  go('login');
}
document.addEventListener('submit',e=>{
  if(e.target.id==='loginForm'){ e.preventDefault(); attemptLogin(); }
  if(e.target.id==='createForm'){ e.preventDefault(); attemptCreate(); }
  if(e.target.id==='forgotForm'){ e.preventDefault(); attemptForgot(); }
  if(e.target.id==='setPasswordForm'){ e.preventDefault(); attemptSetPassword(); }
  if(e.target.id==='helpForm'){ e.preventDefault(); sendHelp(); }
  if(e.target.id==='conciergeForm'){ e.preventDefault(); sendConcierge(); }
});
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-feedzone]');
  if(z){ if(state.screen==='feed') feedAction(z.dataset.feedzone); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(state.screen==='feed'&&state.feedSwipeAt&&Date.now()-state.feedSwipeAt<250) return;
  if(b.id==='loginBtn'){attemptLogin(); return}
  if(b.id==='createBtn'){attemptCreate(); return}
  if(b.id==='forgotBtn'){attemptForgot(); return}
  if(b.id==='setPasswordBtn'){attemptSetPassword(); return}
  if(b.id==='helpSend'){sendHelp(); return}
  if(b.id==='conciergeBtn'){openConcierge(); return}
  if(b.id==='conciergeSend'){sendConcierge(); return}
  if(b.id==='retryBtn'){state.fatalErr=''; go('login'); return}
  if(b.id==='logoutBtn'){attemptLogout(); return}
  if(b.dataset.back) return go(b.dataset.back);
  if(b.dataset.hq){selectTenant(b.dataset.hq); return}
  if(b.dataset.nav){
    if(b.dataset.nav==='choose'){ showChoose(); return }
    const map={opps:'opps',insights:'insights',status:'status',help:'help',search:'search',create:'create',forgot:'forgot'};
    if(map[b.dataset.nav]==='help'){ state.ticketId=null; state.loginErr=''; loadConfig().catch(()=>{}); }
    return go(map[b.dataset.nav]||'home');
  }
  if(b.dataset.view){state.oppView=b.dataset.view; state.lastOppView=b.dataset.view; return go('list')}
  if(b.dataset.feed){openFeed(b.dataset.feed); return}
  if(b.dataset.list){state.oppView=b.dataset.list; return go('list')}
  if(b.dataset.feedtype){state.feedType=b.dataset.feedtype; state.feedIndex=0; state.feedExpanded=false; state.feedErr=''; render(); return}
  if(b.id==='feedSwipeToggle'){state.feedSwipe=!state.feedSwipe; if(state.feedSwipe){state.feedDemo=true; state.feedDemoActions=0;} render(); return}
  if(b.id==='feedHintOff'){pulseToggleHighlight(); return}
  if(b.dataset.feedbtn){feedAction(b.dataset.feedbtn==='collapse'?'up':b.dataset.feedbtn); return}
  if(b.id==='feedBackBtn'){return go('opps')}
  if(b.id==='feedBackFloatBtn'){return go('opps')}
  if(b.id==='feedCollapseBtn'){state.feedExpanded=false; render(); return}
  if(b.id==='feedContactBtn'){const fl=feedCurrent(); if(fl){state.selected=fl.id; openContact();} return}
  if(b.dataset.county){state.oppView='county'; state.county=b.dataset.county; return go('list')}
  if(b.dataset.lead){state.selected=b.dataset.lead; return go('detail')}
  if(b.dataset.insight){state.lastInsightsView=b.dataset.insight; return go('insights')}
  if(b.dataset.status){setStatus(b.dataset.status); return}
  if(b.id==='contactBtn'){openContact(); return}
  if(b.id==='popupX'){closePopup(); return}
  if(b.dataset.contact!==undefined){runContact(Number(b.dataset.contact)); return}
  if(b.id==='doNext'){
    const l=leads().find(x=>x.id===state.selected); if(!l) return;
    const [,target]=nextStep(l); setStatus(target); return;
  }
});
function contactLabel(c){
  if(c.kind==='email') return 'Email';
  if(c.kind==='phone') return 'Call';
  if(c.kind==='link') return c.label||'Link';
  return c.label||'Open';
}
function openContact(){
  const l=leads().find(x=>x.id===state.selected); if(!l) return;
  const cs=l.contacts||[];
  const btns=cs.length? cs.map((c,i)=>`<button class="bigbtn" data-contact="${i}">${esc(contactLabel(c))}</button>`).join('') : '<div class="empty">No contact yet.</div>';
  $('popupRoot').innerHTML=`<div class="overlay" id="overlay"><div class="popup" role="dialog" aria-label="Contact">
    <button class="xbtn" id="popupX" aria-label="Close">✕</button>
    <h2>Contact</h2><div class="stack">${btns}</div><div class="toast" id="toast"></div></div></div>`;
}
function closePopup(){ $('popupRoot').innerHTML=''; }
function closeContact(){ closePopup(); }
function runContact(i){
  const l=leads().find(x=>x.id===state.selected); if(!l) return;
  const c=(l.contacts||[])[i]; if(!c) return;
  if(c.kind==='email'){ window.location.href='mailto:'+c.value; return; }
  if(c.kind==='phone'){
    try{ navigator.clipboard?.writeText(c.value); }catch{}
    const t=$('toast'); if(t) t.textContent='Calling · number copied';
    window.location.href='tel:'+c.value.replace(/[^+0-9]/g,'');
    return;
  }
  window.open(c.url,'_blank','noopener');
}
const STATUS_ERRORS={
  confirmation_required:'Please confirm first.',
  transition_not_allowed:'That change is not available from the current status.',
  tenant_writes_disabled:'Updates are paused for this HQ right now.',
  role_cannot_write:'Your role can view but not update leads.'
};
async function setStatus(target){
  let confirmConversation=false, confirmSent=false;
  if(target==='engaged'){ if(!confirm('Was there a real two-way conversation?')) return; confirmConversation=true; }
  if(target==='outreach_sent'){ if(!confirm('Was outreach actually sent outside this app?')) return; confirmSent=true; }
  try{
    await api('https://fafowzslfscgtahqokpu.supabase.co/functions/v1/ohq/api/leads/'+encodeURIComponent(state.selected)+'/status',{
      method:'POST',
      headers:{'Idempotency-Key': crypto.randomUUID()},
      body:JSON.stringify({tenant:state.tenant, status:target, confirmConversation, confirmSent})
    });
    // 202 = the command is validated and queued for write-back. It is not
    // "saved" until the worker verifies it in Notion, so flag it as saving
    // and let the next refresh show the verified state.
    const l=leads().find(x=>x.id===state.selected);
    if(l){ l.status=target; l.pendingSync=true; }
    go('detail');
  }catch(e){
    alert(STATUS_ERRORS[e.code]||'We could not save that change. Please try again.');
  }
}
document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){state.lastSearch=e.target.value; render(); const si=$('searchInput'); if(si){si.focus(); si.setSelectionRange(si.value.length,si.value.length)}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='feedAreaSel'){state.feedArea=e.target.value; state.feedIndex=0; state.feedExpanded=false; state.feedErr=''; render();}
  if(e.target.id==='feedStatusSel'){state.feedStatus=e.target.value; state.feedIndex=0; state.feedExpanded=false; state.feedErr=''; render();}
  if(e.target.id==='feedStrengthSel'){state.feedStrength=e.target.value; state.feedIndex=0; state.feedExpanded=false; state.feedErr=''; render();}
});
document.addEventListener('click',e=>{ if(e.target.id==='overlay') closePopup(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('popupRoot').innerHTML){closePopup(); return}
  /* Feed arrow keys (desktops): same four actions as swipe and tap.
     Only on the feed screen in swipe mode, never while a popup is
     open, and never while focus sits on an interactive control:
     a button, select, input, textarea, or editable element keeps
     its own arrow keys (the filter selects above all). The keys
     act only when the feed itself has focus (the card or the
     page body). */
  if(state.screen==='feed'&&state.feedSwipe&&e.key.startsWith('Arrow')&&!$('popupRoot').innerHTML){
    const ae=document.activeElement;
    const onControl=ae&&(['BUTTON','SELECT','INPUT','TEXTAREA'].includes(ae.tagName)||ae.isContentEditable);
    if(!onControl){
      e.preventDefault();
      feedAction({ArrowUp:'up',ArrowDown:'down',ArrowRight:'approve',ArrowLeft:'archive'}[e.key]);
      return;
    }
  }
  if(e.key==='Enter'&&['u','p'].includes(document.activeElement?.id)){e.preventDefault(); attemptLogin(); return}
  if(e.key==='Enter'&&['cu','cp'].includes(document.activeElement?.id)){e.preventDefault(); attemptCreate(); return}
  if(e.key==='Enter'&&document.activeElement?.id==='fu'){e.preventDefault(); attemptForgot(); return}
  if(e.key==='Enter'&&document.activeElement?.id==='np'){e.preventDefault(); attemptSetPassword(); return}
  const inField=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);
  if(((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&!inField)){
    e.preventDefault(); if(state.user) go('search');
  }
  if(e.key==='Escape'&&state.tenant) go('home');
});
/* Email-link landing: Supabase returns from recover, invite, signup,
   and magic-link emails with the session in the URL hash. Adopt it
   here, once, then scrub the hash so the one-time token never lingers
   in the address bar. A recovery or invite token must set a password
   first; every other token type already has one, so it bootstraps
   straight in. An error hash (an expired or already-used link) lands
   on Login with a plain explanation. Returns true when it took over
   the first render. */
function adoptEmailLink(){
  const raw=(window.location.hash||'').replace(/^#/,'');
  if(!raw) return false;
  const params=new URLSearchParams(raw);
  const accessToken=params.get('access_token');
  const type=params.get('type');
  const failed=params.get('error')||params.get('error_description');
  try{ history.replaceState(null,'',window.location.pathname+window.location.search); }catch{}
  if(failed){
    state.loginErr='That link has expired. Please request a new one.';
    return false;
  }
  if(!accessToken) return false;
  ACCESS_TOKEN=accessToken;
  if(type==='recovery'||type==='invite'){ go('setpassword'); return true; }
  bootstrap();
  return true;
}
/* Cold load: there is no persisted session to restore (by design). An
   email link is the one exception: adoptEmailLink() consumes the hash
   session first; without one, the only starting point is Login. After
   an in-page sign-in, bootstrap() validates the session via /api/me
   before showing any HQ. */
if(!adoptEmailLink()) render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
